# Fake project for the server container tests (postgres + proxy).
PROJECT_NAME=pgapp
GITHUB_ACCOUNT=example-owner
GITHUB_SSH_HOST=github.com
GITHUB_REPO=example-owner/pgapp
VISIBILITY=public
DB_ENGINE=postgres
WEB_MODE=proxy
HEALTH_PATH=/health
MIGRATE_CMD=printf '%s %s\n' "$DB_NAME" "$TZ" > migrated.txt
SEED_CMD=make seed
MIGRATIONS_GLOB=db/migrations/**
HIGH_RISK_GLOBS=src/auth/**
PROJECT_TIMEZONE=Asia/Manila
LOW_TRAFFIC_HOUR=3
ENV_FILE=.env
ARTIFACT_DIR=.team/artifact
SHARED_PATHS=storage uploads/public
STATIC_ROOT=public
