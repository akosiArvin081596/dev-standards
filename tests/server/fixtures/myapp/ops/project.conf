# Fake project for the server container tests (mariadb + php-fpm).
PROJECT_NAME=myapp
GITHUB_ACCOUNT=example-owner
GITHUB_SSH_HOST=github.com
GITHUB_REPO=example-owner/myapp
VISIBILITY=public
DB_ENGINE=mariadb
WEB_MODE=php-fpm
HEALTH_PATH=/health
MIGRATE_CMD=printf '%s %s\n' "$DB_NAME" "$TZ" > migrated.txt
SEED_CMD=make seed
MIGRATIONS_GLOB=db/migrations/**
HIGH_RISK_GLOBS=src/auth/**
PROJECT_TIMEZONE=America/New_York
LOW_TRAFFIC_HOUR=4
ENV_FILE=.env
ARTIFACT_DIR=.team/artifact
SHARED_PATHS=storage
STATIC_ROOT=public
LOCAL_DB_IMAGE=mariadb:10.11
LOCAL_DB_PORT=5441
